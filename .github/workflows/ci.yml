name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # 3.11 is the documented minimum; 3.x tracks the newest stable release
        python: ['3.11', '3.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install bats-core (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Install bats-core (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch v1.11.0 --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        run: ./run-tests

  install-smoke:
    name: Install smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install, set up, and run doctor in a clean HOME
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          ./install
          export PATH="${HOME}/.local/bin:${PATH}"
          towit help >/dev/null
          towit setup --hook
          # No claude CLI on the runner, so doctor is expected to report exactly that one failure.
          doctor_out="$(towit doctor || true)"
          echo "${doctor_out}"
          grep -F '[PASS] SQLite FTS5 is available' <<<"${doctor_out}"
          grep -F '[PASS] Archive schema current' <<<"${doctor_out}"
          grep -F '[PASS] To Wit hook registered for all events' <<<"${doctor_out}"
          unexpected="$(grep '^\[FAIL\]' <<<"${doctor_out}" | grep -v 'claude CLI not found' || true)"
          if [ -n "${unexpected}" ]; then
            echo "Unexpected doctor failures:" >&2
            echo "${unexpected}" >&2
            exit 1
          fi
          towit stats >/dev/null

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Uses the shellcheck preinstalled on the runner image. Every tracked file with a
      # shell shebang or a .sh/.bash extension is checked (files without a shebang are
      # checked as bash).
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shellcheck --version
          files=()
          while IFS= read -r -d '' f; do
            if [[ "${f}" == *.sh || "${f}" == *.bash ]] || head -n 1 "${f}" | grep -Eq '^#!.*(ba|da|k|z)?sh( |$)'; then
              files+=("${f}")
            fi
          done < <(git ls-files -z)
          printf 'Checking %s\n' "${files[@]}"
          shellcheck --shell=bash --severity=warning "${files[@]}"

  # Single aggregate check for branch protection: it reports even when a matrix job
  # fails or is skipped, and it does not depend on the matrix job names.
  ci-gate:
    if: always()
    needs: [test, install-smoke, shellcheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}"
          if echo "${RESULTS}" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "All required jobs succeeded."
          else
            echo "One or more required jobs did not succeed." >&2
            exit 1
          fi
